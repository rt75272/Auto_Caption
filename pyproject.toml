[project]
name = "shelf-scanner"
version = "0.1.0"
description = "A program to map close-up out-of-stock tags to overall bay images."
requires-python = ">=3.9"
dependencies = [
    "opencv-python",
    "numpy",
    "Pillow",
    "pytesseract",
    "tqdm",
    "colorama",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py"]